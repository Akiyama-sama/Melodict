name: Build/release

on:
  # push:
  #   branches: ['master']

  # pull_request:
  #   branches: ['master']

  workflow_dispatch:

env:
  MAIN_VITE_LAST_FM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
  MAIN_VITE_GENIUS_API_KEY: ${{ secrets.GENIUS_API_KEY }}
  MAIN_VITE_LAST_FM_SHARED_SECRET: ${{ secrets.LAST_FM_SHARED_SECRET }}
  MAIN_VITE_ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
  MAIN_VITE_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # - name: Install correct Sharp Dependencies
      #   run: |
      #     pnpm remove sharp
      #     pnpm add --cpu=wasm32 sharp

      - name: build-linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run build:linux

      - name: build-macos
        if: matrix.os == 'macos-latest'
        run: pnpm run build:mac

      - name: build-win
        if: matrix.os == 'windows-latest'
        run: pnpm run build:win

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 上传到按 package.json 版本命名的草稿 release(与本地 pnpm release:local 共用同一个草稿);
      # 草稿不存在时 softprops 会按 tag 新建一个,同样保持 draft。
      # Upload into the draft release named after package.json's version — the same draft
      # that `pnpm release:local` fills; softprops creates it (still a draft) if missing.
      - name: release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: v${{ steps.ver.outputs.version }}
          name: Knote v${{ steps.ver.outputs.version }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
