name: Build/release

on:
  # push:
  #   branches: ['master']

  # pull_request:
  #   branches: ['master']

  workflow_dispatch:

env:
  MAIN_VITE_MUSIXMATCH_DEFAULT_USER_TOKEN: ${{ secrets.MUSIXMATCH_DEFAULT_USER_TOKEN }}
  MAIN_VITE_LAST_FM_API_KEY: ${{ secrets.LAST_FM_API_KEY }}
  MAIN_VITE_GENIUS_API_KEY: ${{ secrets.GENIUS_API_KEY }}
  MAIN_VITE_LAST_FM_SHARED_SECRET: ${{ secrets.LAST_FM_SHARED_SECRET }}
  MAIN_VITE_ENCRYPTION_SECRET: ${{ secrets.ENCRYPTION_SECRET }}
  MAIN_VITE_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}

jobs:
  release:
    runs-on: ${{ matrix.os }}

    # 创建/更新 release 资产需要 GITHUB_TOKEN 的 contents 写权限(默认只读)
    # creating/updating releases needs GITHUB_TOKEN contents:write (read-only by default)
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # - name: Install correct Sharp Dependencies
      #   run: |
      #     pnpm remove sharp
      #     pnpm add --cpu=wasm32 sharp

      - name: build-linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run build:linux

      - name: build-macos
        if: matrix.os == 'macos-latest'
        run: pnpm run build:mac

      - name: build-win
        if: matrix.os == 'windows-latest'
        run: pnpm run build:win

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 上传到按 package.json 版本命名的草稿 release(与本地 pnpm release:local 共用同一个草稿);
      # 草稿不存在时 softprops 会按 tag 新建一个,同样保持 draft。
      # Upload into the draft release named after package.json's version — the same draft
      # that `pnpm release:local` fills; softprops creates it (still a draft) if missing.
      # 用 gh 上传到按 package.json 版本命名的草稿 release(与本地 pnpm release:local 共用同一个草稿)。
      # softprops/action-gh-release 在更新他人创建的草稿时会 403(Resource not accessible by
      # integration),gh release upload --repo 按标签直传,无此问题;草稿不存在时 create 兜底。
      # Upload with gh into the draft release named after package.json's version — the same
      # draft that `pnpm release:local` fills. softprops fails with 403 when updating a draft
      # created by another token; gh release upload --repo does not have that problem.
      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          # 产物名含空格(如 "Knote v4.1.0-alpha-win-x64.exe"):NUL 分隔收集进数组,展开传参。
          # 不用 mapfile(兼容 bash 3.2)也不用 grep -z(BSD grep 无 -z)。
          # names contain spaces: collect NUL-delimited into an array, expand quoted.
          # no mapfile (bash 3.2 compat) and no grep -z (BSD grep lacks it).
          ASSETS=()
          while IFS= read -r -d '' f; do
            case "$f" in
              dist/builder-debug.yml | dist/builder-effective-config.yaml) continue ;;
            esac
            ASSETS+=("$f")
          done < <(find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' \
            -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.snap' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.yml' -o -name '*.blockmap' \) -print0)
          ls -la "${ASSETS[@]}"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json id >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$VERSION" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Knote v$VERSION" --draft --target "$GITHUB_SHA"
          fi
